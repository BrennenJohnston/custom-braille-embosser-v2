documentation-language: en
function: |
  A fully 3D-printed, hand-turned braille embosser for business-card stock. Two
  interchangeable cylinders generated from the user's text, one carrying the
  raised dots and one the matching dimples, stand side by side in a printed Base;
  a card dropped into the slit at the back is rolled between them and out of the
  window at the front with the braille pressed into it. Each gear has a
  differently shaped peg and each cylinder end a matching keyed hole, so the parts
  go together one way only, and the row-indicator arrows on the cylinders can be
  found by touch, so a blind user can assemble and use it unaided. No off-the-shelf
  parts, fasteners, springs or electronics.

