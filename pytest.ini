[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests
# The repository root, so tests can import scripts/ (the docs gate, the guide
# parser, the PDF builder) under plain `pytest`.
pythonpath = .

addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
